<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · WebGL 2.5D</title>
<!--
  홈 ① 화면 시안 B — WebGL 2.5D.
  three.js 로 제품 컷아웃을 띄우고, 마우스(모바일은 손가락)에 따라
  각도가 바뀌고 살짝 기울며 라이트가 쓸고 지나간다.

  진짜 3D 회전이 아니다. 실제 촬영한 네 각도(옆·비스듬·정면·반대쪽)를
  마우스 위치로 섞어 회전처럼 보이게 한 것이다.
  사진: assets/<이름>.jpg(사진) + <이름>-a.png(모양) 를 캔버스에서 합쳐 텍스처로 쓴다.
-->
<style>
:root{--ink:#1a1a1a;--grey:#6e6e6e;--body:#333;--acc:#1B5E8C;--nav:44px}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
  color:var(--ink);background:#fff;letter-spacing:-.015em;word-break:keep-all;
}
.note{
  position:fixed;top:0;left:0;right:0;z-index:90;background:var(--ink);color:#fff;
  font-size:12px;padding:7px 16px;text-align:center;letter-spacing:0;
}
.note b{color:#7cc0f0}
main{padding-top:30px}

.hero{height:300vh;position:relative;background:#eceef0}
.pin{position:sticky;top:0;height:100vh;overflow:hidden;
     background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#e7eaee 55%,#d9dde2 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fallback{
  position:absolute;inset:0;display:none;place-items:center;padding:40px;
}
.fallback img{max-width:80%;max-height:70%}

.hint{
  position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);
  font-size:13px;color:var(--grey);letter-spacing:0;white-space:nowrap;
  transition:opacity .4s;
}
.hud{position:absolute;top:16px;left:16px;font-size:11px;color:#8a8a8a;letter-spacing:0}

.copy{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 24px 20vh;text-align:center;
  opacity:0;pointer-events:none;transform-origin:50% 55%;
}
.eyebrow{font-size:21px;font-weight:600;color:var(--grey)}
h1{font-size:clamp(40px,5.4vw,64px);font-weight:600;letter-spacing:-.03em;margin-top:28px}
.sub{font-size:clamp(17px,1.9vw,26px);color:var(--body);margin-top:14px}
.pills{display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.pill{
  border-radius:999px;padding:11px 22px;font-size:15px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;text-decoration:none;
}
.pill.ghost{background:transparent;color:var(--ink)}
.after{height:50vh;display:grid;place-items:center;color:var(--grey);font-size:14px}
@media (max-width:767px){
  .hero{height:280vh}
  .copy{padding:0 20px 18vh}
}
</style>
</head>
<body>
<p class="note">시안 B · <b>WebGL 2.5D</b> — 마우스를 좌우로 움직여 보세요. 손가락으로 끌어도 됩니다.</p>
<main>
<section class="hero" id="hero">
  <div class="pin">
    <canvas id="gl" aria-label="디퓨저 라이트를 장착한 Canon EOS R10. 마우스를 움직이면 각도가 바뀝니다" role="img"></canvas>
    <div class="fallback" id="fallback"><img src="assets/kit-left.jpg" alt="디퓨저 라이트를 장착한 Canon EOS R10"></div>
    <div class="hud" id="hud">WebGL 준비 중</div>
    <p class="hint" id="hint">← 마우스를 움직여 돌려 보세요 →</p>

    <div class="copy" id="copy">
      <p class="eyebrow">MediPhoto</p>
      <h1>촬영만 하세요.</h1>
      <p class="sub">사진은 PC로 자동 전송됩니다.</p>
      <div class="pills">
        <a class="pill" href="#">더 알아보기</a>
        <a class="pill ghost" href="#">텔레그램 문의</a>
      </div>
    </div>
  </div>
</section>
<div class="after">여기부터 다음 섹션</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hero = document.getElementById("hero"),
      hud = document.getElementById("hud"),
      hint = document.getElementById("hint"),
      copy = document.getElementById("copy"),
      cv = document.getElementById("gl");

/* 촬영한 각도. 왼쪽 끝이 옆모습, 오른쪽 끝이 반대쪽 비스듬한 모습이다.
   실제로는 네 장뿐이라 그 사이는 겹쳐서 넘긴다. */
const ANGLES = ["kit-side", "kit-left", "kit-front", "kit-right"];
const SIZE = 1024;      // 네 장을 같은 크기 정사각형에 맞춰 둔다. 섞을 때 어긋나지 않는다.

function loadImg(src){
  return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
}

/* 사진(JPEG) 과 모양(PNG) 을 합쳐 배경 없는 정사각형 그림으로 만든다.
   모양 그림은 회색조라 밝기에 모양이 들어 있다. 그 밝기를 알파로 옮긴다. */
async function makeTexture(name){
  const [ph, mask] = await Promise.all([loadImg(`assets/${name}.jpg`), loadImg(`assets/${name}-a.png`)]);
  const w = ph.naturalWidth, h = ph.naturalHeight;

  const t = document.createElement("canvas");
  t.width = w; t.height = h;
  const tc = t.getContext("2d");
  tc.drawImage(ph, 0, 0);
  const pic = tc.getImageData(0, 0, w, h);
  const m2 = document.createElement("canvas");
  m2.width = w; m2.height = h;
  const mc = m2.getContext("2d");
  mc.drawImage(mask, 0, 0, w, h);
  const md = mc.getImageData(0, 0, w, h).data;
  for (let i = 0, n = w * h; i < n; i++) pic.data[i*4 + 3] = md[i*4];
  tc.putImageData(pic, 0, 0);

  // 각도마다 피사체 크기가 달라서 높이를 기준으로 맞춘다
  const sq = document.createElement("canvas");
  sq.width = sq.height = SIZE;
  const c = sq.getContext("2d");
  const s = (SIZE * 0.86) / h;
  c.drawImage(t, (SIZE - w * s) / 2, (SIZE - h * s) / 2, w * s, h * s);
  const tex = new THREE.CanvasTexture(sq);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

const VERT = `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
/* 두 각도를 섞고, 그 위로 빛줄기 하나를 쓸어 준다. */
const FRAG = `
  uniform sampler2D tA, tB;
  uniform float uMix, uTime, uGlow;
  uniform vec2 uLight;
  varying vec2 vUv;
  void main(){
    vec4 a = texture2D(tA, vUv);
    vec4 b = texture2D(tB, vUv);
    vec4 col = mix(a, b, uMix);
    if (col.a < 0.01) discard;

    // 마우스 쪽에서 들어오는 빛. 금속과 유리에 생기는 반사를 흉내 낸다.
    float d = dot(normalize(vec2(uLight.x, uLight.y) + vec2(0.001)), vUv - 0.5);
    float band = smoothstep(0.08, 0.0, abs(d - 0.12 * sin(uTime * 0.35)));
    col.rgb += band * 0.10;

    // 링라이트가 켜진 느낌. 가운데가 은은하게 밝아진다.
    float r = distance(vUv, vec2(0.5, 0.48));
    col.rgb += uGlow * smoothstep(0.42, 0.0, r) * vec3(0.10, 0.13, 0.16);

    gl_FragColor = col;
  }
`;

async function start(){
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({canvas: cv, alpha: true, antialias: true});
  } catch (e) { return fail("WebGL 을 쓸 수 없는 브라우저"); }
  if (!renderer) return fail("WebGL 을 쓸 수 없는 브라우저");

  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  cam.position.z = 6.2;

  hud.textContent = `사진 ${ANGLES.length}장 받는 중`;
  const texes = await Promise.all(ANGLES.map(makeTexture));

  const uni = {
    tA: {value: texes[0]}, tB: {value: texes[1]},
    uMix: {value: 0}, uTime: {value: 0}, uGlow: {value: 0},
    uLight: {value: new THREE.Vector2(0.4, 0.4)},
  };
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 3.6, 1, 1),
    new THREE.ShaderMaterial({uniforms: uni, vertexShader: VERT, fragmentShader: FRAG, transparent: true})
  );
  scene.add(mesh);

  function resize(){
    const w = cv.clientWidth, h = cv.clientHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
    const k = Math.min(1, w / 900);                 // 좁은 화면에서 제품이 잘리지 않게
    mesh.scale.setScalar(0.60 + k * 0.18);
  }
  addEventListener("resize", resize); resize();

  // 마우스 / 손가락 위치를 -1~1 로 둔다
  let tx = 1/3, ty = 0, mx = 1/3, my = 0, touched = false;   // 처음엔 정면
  function at(e){
    const p = e.touches ? e.touches[0] : e;
    const r = cv.getBoundingClientRect();
    tx = ((p.clientX - r.left) / r.width) * 2 - 1;
    ty = ((p.clientY - r.top) / r.height) * 2 - 1;
    if (!touched){ touched = true; hint.style.opacity = "0"; }
  }
  addEventListener("pointermove", at, {passive:true});
  addEventListener("touchmove", at, {passive:true});

  let p = 0;                                        // 스크롤 진행률
  const SEQ_END = .74, OUT = .84;
  function onScroll(){
    const r = hero.getBoundingClientRect(), span = hero.offsetHeight - innerHeight;
    p = REDUCED ? 1 : Math.min(1, Math.max(0, -r.top / span));
    const o = Math.min(1, Math.max(0, (p - SEQ_END) / (OUT - SEQ_END)));
    const oe = o * o * (3 - 2 * o);
    cv.style.opacity = String(1 - oe);
    hud.style.opacity = hint.style.opacity = String(touched ? 0 : (1 - oe));
    const rr = Math.min(1, Math.max(0, (p - OUT) / (1 - OUT)));
    const e = rr * rr * (3 - 2 * rr);
    copy.style.opacity = String(e);
    copy.style.transform = `translateY(${(1 - e) * 26}px) scale(${.94 + e * .06})`;
    copy.style.pointerEvents = e > .6 ? "auto" : "none";
  }
  let ticking = false;
  addEventListener("scroll", () => {
    if (!ticking){ ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); }
  }, {passive:true});
  onScroll();

  const clock = new THREE.Clock();
  function frame(){
    requestAnimationFrame(frame);
    mx += (tx - mx) * 0.07;                        // 따라오는 속도. 낮을수록 묵직하다
    my += (ty - my) * 0.07;

    // 마우스를 좌우로 옮기면 찍어 둔 네 각도 사이를 지나간다
    const t = (mx * 0.5 + 0.5) * (ANGLES.length - 1);
    const i = Math.min(ANGLES.length - 2, Math.floor(t));
    uni.tA.value = texes[i];
    uni.tB.value = texes[i + 1];
    // 각도가 넷뿐이라 반반 섞으면 두 장이 겹쳐 흐릿해진다.
    // 가운데 구간만 짧게 지나가도록 해서 거의 한 장만 보이게 한다.
    const f = t - i;
    const k = Math.min(1, Math.max(0, (f - .46) / .08));
    uni.uMix.value = k * k * (3 - 2 * k);

    // 각도 사이를 메우는 미세한 기울기. 회전처럼 보이게 한다
    mesh.rotation.y = -mx * 0.10;
    mesh.rotation.x = my * 0.06;
    mesh.position.x = mx * 0.12;
    mesh.position.y = -my * 0.08;

    uni.uLight.value.set(mx, -my);
    uni.uTime.value = clock.getElapsedTime();
    uni.uGlow.value = 0.30 + 0.22 * Math.sin(clock.getElapsedTime() * 0.8);
    renderer.render(scene, cam);
    if (hud.textContent !== "WebGL · 실사 4각도") hud.textContent = "WebGL · 실사 4각도";
  }
  frame();
}

function fail(why){
  cv.style.display = "none";
  document.getElementById("fallback").style.display = "grid";
  hud.textContent = why + " — 사진 한 장으로 보여 줍니다";
  hint.style.display = "none";
}

if (!window.THREE) fail("three.js 를 받지 못했습니다");
else start().catch(e => fail("그림을 받지 못했습니다"));
</script>
</body>
</html>
